name: MediaForge editing style preset tests
on:
  push:
    branches: [feat/mediaforge-style-minimal-outline-20261117]
  pull_request:
    branches: [feature/unific-media-20261116]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Test editorial preset and existing planner
        run: node --test test/editing-style-presets.test.mjs test/creative-director.test.mjs
