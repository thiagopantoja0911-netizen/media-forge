name: Frame Lab QA
on:
  push:
    branches: ['feature/frame-lab-*']
    paths:
      - 'frame-lab/**'
      - '.github/workflows/frame-lab-qa.yml'
  pull_request:
    paths:
      - 'frame-lab/**'
      - '.github/workflows/frame-lab-qa.yml'
  workflow_dispatch:
jobs:
  frame-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frame-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production Node dependencies (OpenCV WASM, sharp, FFmpeg)
        run: npm install --no-audit --no-fund
      - name: Verify Node syntax and motion compiler
        run: |
          node --check server.mjs
          node --check analyze-node.mjs
          node --check motion-curves.mjs
          node --test tests/curves.test.mjs
      - name: API security and project isolation
        run: node --test tests/api.test.mjs
      - name: Full-frame synthetic video reconstruction QA
        run: node --test tests/synthetic-node.test.mjs
