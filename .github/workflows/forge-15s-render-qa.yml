name: Forge Midjourney 15s 4K60 technical render

on:
  push:
    branches:
      - qa/forge-midjourney-15s-4k60-20261111
    paths:
      - scripts/forge-15s-render-smoke.mjs
      - .github/workflows/forge-15s-render-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated static FFmpeg and ffprobe without apt mirrors
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/forge-audio-tools/bin"
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/forge-audio-tools" --no-save @ffmpeg-installer/linux-x64 @ffprobe-installer/linux-x64
          cp "$RUNNER_TEMP/forge-audio-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/forge-audio-tools/bin/ffmpeg"
          cp "$RUNNER_TEMP/forge-audio-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/forge-audio-tools/bin/ffprobe"
          chmod +x "$RUNNER_TEMP/forge-audio-tools/bin/ffmpeg" "$RUNNER_TEMP/forge-audio-tools/bin/ffprobe"
          echo "$RUNNER_TEMP/forge-audio-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/forge-audio-tools/bin/ffmpeg" -version | head -1
          "$RUNNER_TEMP/forge-audio-tools/bin/ffprobe" -version | head -1
      - name: Verify smoke-test script syntax
        run: node --check scripts/forge-15s-render-smoke.mjs
      - name: Render a 15s vertical 4K60 composition with diagnostic audio
        run: node scripts/forge-15s-render-smoke.mjs
      - name: Upload MP4 and technical ffprobe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-midjourney-15s-4k60-technical
          path: ${{ runner.temp }}/forge-midjourney-technical-qa/
          if-no-files-found: warn
          retention-days: 3
