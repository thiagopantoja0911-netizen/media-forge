name: MediaForge Staging Connection Smoke
on:
  push:
    branches: [feature/conexoes-mediaforge-primeiro]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/staging-health.mjs
