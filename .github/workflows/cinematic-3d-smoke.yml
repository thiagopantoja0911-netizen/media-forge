name: MediaForge Cinematic 3D Browser Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/cinematic-3d.mjs'
      - 'src/videos-secrets-mcp.mjs'
      - 'scripts/check-cinematic-3d.mjs'
      - '.github/workflows/cinematic-3d-smoke.yml'

jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check src/cinematic-3d.mjs
      - run: node scripts/check-cinematic-3d.mjs
