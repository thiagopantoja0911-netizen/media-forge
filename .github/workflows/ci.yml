name: MediaForge CI

on:
  push:
    branches: [main, feature/conexoes-mediaforge-primeiro]
  pull_request:
    branches: [main, migration/videos-secrets-to-mediaforge, feature/conexoes-mediaforge-primeiro]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/job-schema.mjs
      - run: node --check src/legacy-studio.mjs
      - run: node --check src/creator-composer.mjs
      - run: node --check src/studio.mjs
      - run: node --check src/studio-api.mjs
      - run: node --check scripts/import-salevo-studio.mjs
      - run: node --check scripts/extract-creator-package.mjs
      - run: node --check src/creator-package.mjs
      - run: node --check src/server.mjs
      - run: node --check src/remote-worker-server.mjs
      - run: node --check src/remote-worker-client.mjs
      - run: node --check src/videos-secrets-mcp.mjs
      - run: node --check src/worker.mjs
      - run: node --check src/renderers/hyperframes.mjs
      - run: node --test test/*.test.mjs
      - run: npm run validate
      - name: Check generated Forge Midjourney composition with HyperFrames
        run: node scripts/check-creator-composition.mjs
      - name: Upload Forge Midjourney review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-creator-review-snapshots
          path: ${{ runner.temp }}/mediaforge-creator-snapshots
          if-no-files-found: warn
          retention-days: 7
      - name: Verify public staging TLS, OAuth and access controls
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/conexoes-mediaforge-primeiro'
        run: node scripts/staging-health.mjs


  windows-background:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          $paths = @(
            "desktop/run-worker.ps1",
            "desktop/start-worker-background.ps1",
            "desktop/connect-remote.ps1",
            "desktop/install-worker.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell 5.1 syntax OK: $path"
          }
