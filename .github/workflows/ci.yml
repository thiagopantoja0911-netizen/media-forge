name: MediaForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/job-schema.mjs
      - run: node --check src/server.mjs
      - run: node --check src/worker.mjs
      - run: node --check src/renderers/hyperframes.mjs
      - run: node --test test/job-schema.test.mjs
      - run: npm run validate
