name: Maintenance Bridge Safety
on:
  push:
    branches:
      - feat/server-maintenance-bridge-live-20261114
  pull_request:
    branches:
      - feature/frame-lab-chat-mcp-20261113
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax verification
        run: |
          node --check src/maintenance-bridge.mjs
          node --check src/maintenance-worker.mjs
          node --check src/remote-worker-client.mjs
          node --check src/remote-worker-server.mjs
          node --check src/server.mjs
      - name: Maintenance authorization regression tests
        run: node --test test/maintenance-bridge.test.mjs
      - name: Existing remote worker regression tests
        run: node --test test/remote-connection.test.mjs
