name: MediaForge visual timeline + Three.js preview CI
on:
  push:
    branches: [feat/mediaforge-visual-timeline-3d-20261117]
  pull_request:
    branches: [feature/unific-media-20261116]
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Validate browser client JavaScript
        run: node --check editor-studio/app.js
      - name: Validate editor server and Three.js packages
        run: node --test test/editor-depth-of-field.test.mjs test/editor-beat-sync.test.mjs test/editor-typography.test.mjs test/editor-motion-blur.test.mjs test/editor-premium.test.mjs test/editor-review-gate.test.mjs test/editor-studio.test.mjs test/editor-midflow.test.mjs test/cinematic-3d.test.mjs test/studio-api.test.mjs
