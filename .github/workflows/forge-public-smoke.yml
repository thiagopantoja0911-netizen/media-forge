name: Forge Midjourney public staging smoke

on:
  push:
    branches:
      - qa/forge-midjourney-15s-4k60-20261111
    paths:
      - scripts/forge-public-smoke.mjs
      - .github/workflows/forge-public-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-https:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public HTTPS and preview-only authorization
        run: node scripts/forge-public-smoke.mjs
